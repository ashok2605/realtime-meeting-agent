[project]
name = "gladiator"
version = "0.1.0"
description = "Gladiator — realtime Google Meet discovery agent (Recall.ai + Gemini Live)"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.16",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "websockets>=14.0",
]

[project.scripts]
gladiator = "gladiator.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gladiator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Human-readable copy (discovery questions, prompt text) reads better unwrapped.
"src/gladiator/core/discovery.py" = ["E501"]
"src/gladiator/gemini/prompts.py" = ["E501"]
"src/gladiator/gemini/tools.py" = ["E501"]
# uvicorn startup poll + replay reading one small file once: fine as written.
"src/gladiator/main.py" = ["ASYNC110", "ASYNC240"]
"tests/*" = ["ASYNC109"]
