<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Gladiator</title>
<style>
  /* This page IS the bot's camera tile in the meeting: keep it bold and legible. */
  html, body { margin:0; height:100%; background:#0b0e14; color:#e6e9f0;
               font-family:'Helvetica Neue', Arial, sans-serif; overflow:hidden; }
  .wrap { height:100%; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:28px; }
  .orb { width:160px; height:160px; border-radius:50%;
         background:radial-gradient(circle at 35% 30%, #3d4863, #141a28);
         border:3px solid #2a3450; transition:all .25s ease; }
  .orb.listening { border-color:#3ba55d; box-shadow:0 0 60px #3ba55d55; }
  .orb.thinking  { border-color:#e8b93e; box-shadow:0 0 60px #e8b93e55;
                   animation:pulse 1.1s ease-in-out infinite; }
  .orb.speaking  { border-color:#4f8ff7; box-shadow:0 0 80px #4f8ff788;
                   animation:pulse .55s ease-in-out infinite; }
  .orb.holding   { border-color:#b8543e; box-shadow:0 0 60px #b8543e55; }
  @keyframes pulse { 50% { transform:scale(1.06); } }
  h1 { margin:0; font-size:44px; letter-spacing:10px; font-weight:200; }
  .state { font-size:20px; color:#8a93a8; text-transform:uppercase; letter-spacing:4px; }
  .debug { position:fixed; bottom:10px; left:12px; font:11px monospace; color:#3d4763; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>GLADIATOR</h1>
    <div id="orb" class="orb"></div>
    <div id="state" class="state">connecting</div>
  </div>
  <div id="debug" class="debug"></div>
  <script src="/static/agent/agent.js"></script>
</body>
</html>
